spring.application.name=Inventory-Mangement

spring.datasource.url=jdbc:mysql://localhost:3306/inventoryprod
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
server.port=8788

# Note: auth now goes through com.inventory.security (JWT + custom UserDetailsService),
# so the old default Spring Security in-memory user is no longer used.